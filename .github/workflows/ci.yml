name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Backend install
        run: npm install

      - name: Backend build
        run: npm run build

      - name: Backend tests
        run: npm test

      - name: Frontend install
        working-directory: web
        run: npm install

      - name: Frontend build
        working-directory: web
        run: npm run build
